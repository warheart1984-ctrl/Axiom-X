[package]
name = "axiom-x-user"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Axiom-X user-space runtime (int 0x80 syscalls) and ring-3 test programs"

# Standalone: user programs are freestanding ELF binaries for
# x86_64-unknown-none, built separately from the kernel workspace:
#   cargo build --release --target x86_64-unknown-none
[workspace]
members = [".", "agent"]

[dependencies]
# Same rights vocabulary and chain verifier as the kernel.
axiom-x-capability = { path = "../axiom-x-capability", default-features = false }
axiom-x-ledger = { path = "../axiom-x-ledger" }

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "elf-hello"
path = "src/bin/elf-hello.rs"

[[bin]]
name = "elf-heap"
path = "src/bin/elf-heap.rs"

[[bin]]
name = "elf-egress"
path = "src/bin/elf-egress.rs"
test = false

[[bin]]
name = "elf-fast"
path = "src/bin/elf-fast.rs"
test = false

[[bin]]
name = "elf-slow"
path = "src/bin/elf-slow.rs"
test = false

[[bin]]
name = "elf-init"
path = "src/bin/elf-init.rs"
test = false

[[bin]]
name = "elf-crash"
path = "src/bin/elf-crash.rs"
test = false

[[bin]]
name = "elf-noperm"
path = "src/bin/elf-noperm.rs"
test = false

[[bin]]
name = "elf-audit"
path = "src/bin/elf-audit.rs"
test = false

[[bin]]
name = "elf-shell"
path = "src/bin/elf-shell.rs"
test = false

[[bin]]
name = "elf-fsstress"
path = "src/bin/elf-fsstress.rs"
test = false

[[bin]]
name = "elf-fswriter"
path = "src/bin/elf-fswriter.rs"
test = false

[profile.release]
opt-level = "s"
panic = "abort"
debug = false
