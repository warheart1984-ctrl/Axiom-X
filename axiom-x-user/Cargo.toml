[package]
name = "axiom-x-user"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Axiom-X user-space runtime (int 0x80 syscalls) and ring-3 test programs"

# Standalone: user programs are freestanding ELF binaries for
# x86_64-unknown-none, built separately from the kernel workspace:
#   cargo build --release --target x86_64-unknown-none
[workspace]

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "elf-hello"
path = "src/bin/elf-hello.rs"
test = false

[[bin]]
name = "elf-fast"
path = "src/bin/elf-fast.rs"
test = false

[[bin]]
name = "elf-slow"
path = "src/bin/elf-slow.rs"
test = false

[profile.release]
opt-level = "s"
panic = "abort"
debug = false
