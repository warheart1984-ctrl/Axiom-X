[workspace]
resolver = "2"
members = [
    "axiom-x-math",
    "axiom-x-arch-traits",
    "axiom-x-arch-x86_64",
    "axiom-x-arch",
    "axiom-x-boot",
    "axiom-x-sys",
    "axiom-x-test",
    "axiom-x-principal",
    "axiom-x-capability",
    "axiom-x-capability-lineage",
    "axiom-x-ledger",
    "axiom-x-ledger-tool",
    "axiom-x-fs",
    "axiom-x-kernel",
]
exclude = ["axiom-x-init", "axiom-x-capability-lineage"]

# Host-testable crates only. The freestanding kernel crates (axiom-x-arch-x86_64,
# axiom-x-arch, axiom-x-boot, axiom-x-kernel, axiom-x-test) use target-specific
# ABIs (x86-interrupt, naked asm) that the Windows/MSVC host codegen cannot
# compile (upstream rustc/LLVM bugs). Build/check those with:
#   cargo build --workspace --target x86_64-unknown-none
default-members = ["axiom-x-math", "axiom-x-sys", "axiom-x-arch-traits", "axiom-x-ledger", "axiom-x-ledger-tool", "axiom-x-fs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sovereign-x/axiom-x"

[workspace.dependencies]
# Core dependencies
bitflags = "1.3"
heapless = "0.8"
spin = "0.9"
volatile = "0.4"
x86_64 = "0.15"
multiboot2 = "0.25"
raw-cpuid = "10"
zerocopy = { version = "0.8", features = ["derive"] }
tinyvec = "1"

# Logging (no-std compatible)
log = { version = "0.4", default-features = false }

# Testing
proptest = "1.2"
quickcheck = "1.0"
criterion = "0.5"

[workspace.lints]
rust.all = "warn"
rust.unused_crate_dependencies = "allow"
clippy.all = "warn"
clippy.pedantic = "allow"
clippy.nursery = "allow"
clippy.cargo = "allow"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false

# Signature arithmetic is unusably slow unoptimized (kernel debug builds
# run it under QEMU TCG); optimize just the ledger crate.
[profile.dev.package.axiom-x-ledger]
opt-level = 3

[profile.dev.package.axiom-x-fs]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"